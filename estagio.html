<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estágio em Desenvolvimento</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .description {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
        }

        #timer-container {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.4em;
            color: #e74c3c;
            font-weight: bold;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 8px;
            border: 1px solid #ef9a9a;
        }

        .question {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fdfdfd;
        }

        .question h2 {
            margin-top: 0;
            color: #34495e;
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        .options label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
            padding: 10px;
            background-color: #ecf0f1;
            border-radius: 5px;
            transition: background-color 0.2s ease;
        }

        .options label:hover:not(.disabled-label) {
            background-color: #e0e6e7;
        }

        .options input[type="radio"] {
            margin-right: 10px;
            accent-color: #3498db;
        }

        .feedback {
            margin-top: 10px;
            font-weight: bold;
            text-align: right;
            min-height: 20px;
        }

        .correct {
            color: #27ae60;
        }

        .incorrect {
            color: #e74c3c;
        }

        .question button {
            display: block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        .question button:hover:not(:disabled) {
            background-color: #2980b9;
        }

        .question button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .disabled-label {
            cursor: not-allowed !important;
            opacity: 0.7;
        }

        #result-container {
            margin-top: 40px;
            padding: 20px;
            background-color: #e8f6f3;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #b2dfdb;
            display: none;
        }

        #result-container h2 {
            color: #2c3e50;
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        #result-container p {
            font-size: 1.2em;
            color: #333;
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 20px;
            }
            h1 {
                font-size: 1.6em;
            }
            .question h2 {
                font-size: 1.1em;
            }
            #timer-container {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>Estágio em Desenvolvimento de Sistemas</h1>
        <p class="description">Teste seus conhecimentos básicos para uma vaga de estágio!</p>

        <div id="timer-container">Tempo restante: <span id="time">03:00</span></div>

        <form id="quizForm">
            <!--JavaScript -->
        </form>

        <div id="result-container">
            <h2>Finalizado!</h2>
            <p>Sua pontuação final é: <span id="finalScore">0</span>/<span id="totalQuestionsCount">10</span></p>
        </div>
    </div>

    <script>
        const allQuestions = [
            {
                id: 1,
                question: "1. Qual das linguagens abaixo é mais utilizada para criar a estrutura e o conteúdo de páginas web?",
                options: {
                    a: "JavaScript",
                    b: "CSS",
                    c: "HTML",
                    d: "Python"
                },
                correct: "c"
            },
            {
                id: 2,
                question: "2. O que significa a sigla CSS no contexto de desenvolvimento web?",
                options: {
                    a: "Computer Style Sheets",
                    b: "Cascading Style Sheets",
                    c: "Creative Style Solutions",
                    d: "Coded Styling System"
                },
                correct: "b"
            },
            {
                id: 3,
                question: "3. Qual linguagem de programação é frequentemente utilizada para adicionar interatividade e dinamismo a páginas web (client-side)?",
                options: {
                    a: "Python",
                    b: "Java",
                    c: "PHP",
                    d: "JavaScript"
                },
                correct: "d"
            },
            {
                id: 4,
                question: "4. O que é um 'bug' em programação?",
                options: {
                    a: "Um tipo de ferramenta de desenvolvimento.",
                    b: "Um erro ou falha no código de um programa.",
                    c: "Uma nova funcionalidade adicionada a um software.",
                    d: "Um arquivo de documentação do projeto."
                },
                correct: "b"
            },
            {
                id: 5,
                question: "5. Qual das opções descreve melhor o papel de um 'Backend Developer'?",
                options: {
                    a: "Cria a interface visual que o usuário vê e interage.",
                    b: "Lida com a lógica do servidor, bancos de dados e APIs.",
                    c: "Projeta o layout e a experiência do usuário (UX).",
                    d: "Testa a segurança de redes e sistemas."
                },
                correct: "b"
            },
            {
                id: 6,
                question: "6. Qual a finalidade de um sistema de controle de versão como o Git?",
                options: {
                    a: "Apenas para hospedar sites na internet.",
                    b: "Gerenciar e rastrear mudanças no código de um projeto, facilitando a colaboração.",
                    c: "Criar designs gráficos para interfaces de usuário.",
                    d: "Otimizar o desempenho de bancos de dados."
                },
                correct: "b"
            },
            {
                id: 7,
                question: "7. O que é um banco de dados?",
                options: {
                    a: "Um programa para editar imagens.",
                    b: "Uma coleção organizada de dados, estruturada para fácil acesso e gerenciamento.",
                    c: "Um tipo de cabo de rede.",
                    d: "Um sistema operacional."
                },
                correct: "b"
            },
            {
                id: 8,
                question: "8. Qual é a função principal de um algoritmo?",
                options: {
                    a: "Definir a aparência visual de uma página web.",
                    b: "Um conjunto de instruções passo a passo para resolver um problema ou realizar uma tarefa.",
                    c: "Armazenar informações de forma temporária.",
                    d: "Conectar diferentes computadores em uma rede."
                },
                correct: "b"
            },
            {
                id: 9,
                question: "9. O que significa 'Front-end' no desenvolvimento web?",
                options: {
                    a: "A parte do sistema que interage com o banco de dados.",
                    b: "A parte do servidor que processa as requisições.",
                    c: "A parte da aplicação que o usuário vê e com a qual interage diretamente.",
                    d: "O processo de deploy e hospedagem de um site."
                },
                correct: "c"
            },
            {
                id: 10,
                question: "10. Qual é um dos pilares da programação orientada a objetos (POO)?",
                options: {
                    a: "Scripting dinâmico",
                    b: "Modularização procedimental",
                    c: "Herança",
                    d: "Tipagem estática"
                },
                correct: "c"
            }
        ];

        let score = 0;
        let answeredQuestionsCount = 0;
        const totalQuestions = allQuestions.length;
        let timerInterval;
        let timeLeft = 3 * 60; 
        const quizForm = document.getElementById('quizForm');
        const timeDisplay = document.getElementById('time');
        const finalScoreSpan = document.getElementById('finalScore');
        const totalQuestionsCountSpan = document.getElementById('totalQuestionsCount');

        // shuffler
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // render
        function renderQuestions() {
            shuffleArray(allQuestions); 
            quizForm.innerHTML = ''; // clear form

            allQuestions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.id = `q${q.id}`;

                const questionTitle = document.createElement('h2');
                questionTitle.textContent = `${index + 1}. ${q.question.substring(q.question.indexOf('.') + 1).trim()}`; // Remove o número da pergunta original para o novo índice

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                const optionKeys = Object.keys(q.options);
                shuffleArray(optionKeys); 

                optionKeys.forEach(key => {
                    const label = document.createElement('label');
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `q${q.id}`;
                    input.value = key;
                    label.appendChild(input);
                    label.appendChild(document.createTextNode(q.options[key]));
                    optionsDiv.appendChild(label);
                });

                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'feedback';
                feedbackDiv.id = `feedback${q.id}`;

                const button = document.createElement('button');
                button.type = 'button';
                button.textContent = 'Verificar';
                button.onclick = () => checkAnswer(q.id);

                questionDiv.appendChild(questionTitle);
                questionDiv.appendChild(optionsDiv);
                questionDiv.appendChild(feedbackDiv);
                questionDiv.appendChild(button);
                quizForm.appendChild(questionDiv);
            });
        }

        // timer
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endQuiz();
                }
            }, 1000);
        }

        function checkAnswer(questionId) {
            const questionData = allQuestions.find(q => q.id === questionId);
            const questionElement = document.getElementById(`q${questionId}`);
            const selectedOption = questionElement.querySelector(`input[name="q${questionId}"]:checked`);
            const feedbackElement = document.getElementById(`feedback${questionId}`);
            const checkButton = questionElement.querySelector('button');

            // desable button
            const radioButtons = questionElement.querySelectorAll('input[type="radio"]');
            radioButtons.forEach(radio => radio.disabled = true);
            questionElement.querySelectorAll('label').forEach(label => label.classList.add('disabled-label'));
            checkButton.disabled = true;

            if (selectedOption) {
                if (selectedOption.value === questionData.correct) {
                    feedbackElement.innerHTML = "Correto! &#x2705;";
                    feedbackElement.className = "feedback correct";
                    score++;
                } else {
                    feedbackElement.innerHTML = `Incorreto. A resposta correta era: ${questionData.options[questionData.correct]}. &#x274C;`;
                    feedbackElement.className = "feedback incorrect";
                    const correctLabel = questionElement.querySelector(`label input[value="${questionData.correct}"]`).parentNode;
                    correctLabel.style.backgroundColor = '#d4edda';
                }
            } else {
                feedbackElement.innerHTML = "Por favor, selecione uma opção.";
                feedbackElement.className = "feedback incorrect";
                checkButton.disabled = false;
                radioButtons.forEach(radio => radio.disabled = false);
                questionElement.querySelectorAll('label').forEach(label => label.classList.remove('disabled-label'));
                return;
            }

            answeredQuestionsCount++;
            if (answeredQuestionsCount === totalQuestions) {
                clearInterval(timerInterval);
                endQuiz();
            }
        }

        function endQuiz() {
            
            const allRadioButtons = quizForm.querySelectorAll('input[type="radio"]');
            allRadioButtons.forEach(radio => radio.disabled = true);
            quizForm.querySelectorAll('label').forEach(label => label.classList.add('disabled-label'));

            const allButtons = quizForm.querySelectorAll('button');
            allButtons.forEach(button => button.disabled = true);

            
            finalScoreSpan.textContent = score;
            totalQuestionsCountSpan.textContent = totalQuestions;
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('result-container').scrollIntoView({ behavior: 'smooth', block: 'end' });
            document.getElementById('timer-container').style.color = '#27ae60'; 
            document.getElementById('timer-container').innerHTML = "Tempo esgotado!";
        }

        // onload
        document.addEventListener('DOMContentLoaded', () => {
            renderQuestions();
            startTimer();
        });
    </script>
</body>
</html>
