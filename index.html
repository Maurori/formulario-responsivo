<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário Interativo</title>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">

</script>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    .question { margin-bottom: 20px; }
    .option { display: block; margin: 5px 0; padding: 10px; border: 1px solid #ccc; cursor: pointer; }
    .option:hover { background-color: #f0f0f0; }
    .selected { background-color: #cce5ff; border-color: #3399ff; }
    .disabled { pointer-events: none; opacity: 0.6; }
    #nextBtn { margin-top: 20px; display: none; }
    #status { margin-top: 20px; font-weight: bold; color: green; }
    #formArea {
  background-color: #eef6ff; /* cor suave */
  border: 2px dashed #ccc;
  padding: 20px;
  border-radius: 10px;
  transition: background-color 0.3s ease;
}
  </style>
</head>
<body >
  <div id="formArea">
  <h2>Digite seu nome e serie :</h2>
<input type="text" id="userName" placeholder="Seu nome" maxlength="50" minlength="10" required style="padding: 10px; width: 100%; margin-bottom: 10px;">
<input type="text" id="userSerie" placeholder="Sua serie" maxlength="10" minlength="2" required style="padding: 10px; width: 100%; margin-bottom: 10px;">
 
<button onclick="iniciarQuiz()" style="padding: 10px;">Iniciar</button>
<div id="quizContainer" style="display:none;"></div>
<button id="nextBtn">Próxima Pergunta</button>
<div id="status"></div>

  <h2>Responda às perguntas:</h2>
  
  <div id="quizContainer" style="display:none;"></div>
  <button id="nextBtn">Próxima Pergunta</button>
</div>
<div id="status"></div>


  <div id="quizContainer"></div>
  <button id="nextBtn">Próxima Pergunta</button>
</div>
  <button id="nextBtn">Próxima Pergunta</button>
  <div id="status"></div>

  <script>
    emailjs.init("2USzg7NVPSVWbunmn"); // publicKey do EmailJS
    

    const questions = [
      { text: "Qual é a capital do Brasil?", options: ["São Paulo", "Rio de Janeiro", "Brasília", "Salvador", "Curitiba"] },
      { text: "Qual é o maior planeta do sistema solar?", options: ["Terra", "Marte", "Júpiter", "Saturno", "Vênus"] },
      { text: "Quem escreveu 'Dom Casmurro'?", options: ["Machado de Assis", "Carlos Drummond", "Clarice Lispector", "Graciliano Ramos", "Jorge Amado"] },
      { text: "Qual é o elemento químico representado por 'O'?", options: ["Ouro", "Oxigênio", "Prata", "Carbono", "Hidrogênio"] },
      { text: "Quantos continentes existem?", options: ["4", "5", "6", "7", "8"] }
    ];
    const originalQuestions = [...questions]; //  ordem original
    const shuffledQuestions = [...questions].sort(() => Math.random() - 0.5); // Embaralha

    let currentQuestion = 0;
    const respostas = [];
    const quizContainer = document.getElementById("quizContainer");
    const nextBtn = document.getElementById("nextBtn");
    const statusDiv = document.getElementById("status");

    let userName = "";
    let userSerie = "";

function iniciarQuiz() {
  const input = document.getElementById("userName");
    const input2 = document.getElementById("userSerie");

  const nome = input.value.trim();
  const serie = input2.value.trim();
  if (nome.length < 7) {
    alert("Por favor, digite um nome com pelo menos 7 caracteres.");
    return;
  }
  if(serie.length <2){
    alert("Por favor, digite um nome com pelo menos 2 caracteres.");
    return;
  }

  userName = nome;
  userSerie= serie
  input.style.display = "none";
  input2.style.display="none"
  document.querySelector("button[onclick='iniciarQuiz()']").style.display = "none";
  document.getElementById("quizContainer").style.display = "block";
  loadQuestion(currentQuestion);
  document.addEventListener("contextmenu", e => e.preventDefault());
}

    function loadQuestion(index) {
      quizContainer.innerHTML = "";
      nextBtn.style.display = "none";

      const q = shuffledQuestions[index];
      const questionDiv = document.createElement("div");
      questionDiv.className = "question";
      questionDiv.innerHTML = `<strong>${q.text}</strong>`;

      q.options.forEach((opt, i) => {
        const optDiv = document.createElement("div");
        optDiv.className = "option";
        optDiv.textContent = `${String.fromCharCode(97 + i)}) ${opt}`;

        optDiv.onclick = () => {
  document.querySelectorAll(".option").forEach(el => {
    el.classList.add("disabled");
    el.classList.remove("selected");
  });
  optDiv.classList.add("selected");

  // mostra o índice da pergunta embaralhada na lista original
  const originalIndex = originalQuestions.findIndex(p => p.text === q.text);
  respostas[originalIndex] = opt; // Salva na posição correta

  nextBtn.style.display = "inline-block";
};
        questionDiv.appendChild(optDiv);
      });

      quizContainer.appendChild(questionDiv);
    }

    nextBtn.onclick = () => {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion(currentQuestion);
      } else {
        quizContainer.innerHTML = "<h3>formulário concuido. Enviando...</h3>";
        nextBtn.style.display = "none";
        enviarFormulario();
      }
    };
    let mouseLeaveHandler = () => {
  alert("⚠️ Se você sair da área do formulário. Sua prova será cancelada.");
  // window.location.href = "cancelado.html";
};

document.body.addEventListener("mouseleave", mouseLeaveHandler);


    function enviarFormulario() {
  // Remove o evento mouseleave
  document.body.removeEventListener("mouseleave", mouseLeaveHandler);

  const templateParams = {
    to_email: "maurori@prof.educacao.sp.gov.br",
    nome_usuario: userName,
    serie_usuario: userSerie,
    respostas: respostas.map((r, i) => `Q${i + 1}: ${r}`).join("\n")
  };

  emailjs.send("service_goman9p", "template_3k5hl9e", templateParams)
    .then(() => {
      statusDiv.textContent = "✅ Formulário enviado com sucesso!";
    })
    .catch(() => {
      statusDiv.textContent = "❌ Erro ao enviar o formulário.";
      statusDiv.style.color = "red";
    });
}
   //  

  emailjs.send("service_goman9p", "template_3k5hl9e", templateParams)
    .then(() => {
      statusDiv.textContent = "✅ Formulário enviado com sucesso!";
    })
    .catch(() => {
      statusDiv.textContent = "❌ Erro ao enviar o formulário.";
      statusDiv.style.color = "red";
    });


    loadQuestion(currentQuestion);


    document.body.addEventListener("mouseleave", () => {
  alert("⚠️ Se você sair da área do formulário. Sua prova será cancelada.");
  
  // window.location.href = "cancelado.html"; //redirecionar
});
  </script>

</body>
</html>
